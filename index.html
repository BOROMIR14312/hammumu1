<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HAMMUMU</title>
<style>
  :root {
    --bg: #1a1030;
    --panel: #2a1b4d;
    --accent: #ffb937;
    --accent2: #ff5c8a;
    --text: #fdf6ff;
    --hole: #120a24;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1030; --panel: #2a1b4d; --accent: #ffb937;
      --accent2: #ff5c8a; --text: #fdf6ff; --hole: #120a24;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1a1030; --panel: #2a1b4d; --accent: #ffb937;
    --accent2: #ff5c8a; --text: #fdf6ff; --hole: #120a24;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% -20%, #3b2a6b 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100%;
    padding: 16px;
    user-select: none;
    overflow: hidden;
  }
  h1 {
    font-size: clamp(2rem, 6vw, 3.4rem);
    letter-spacing: 0.18em;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 30px rgba(255, 185, 55, 0.25);
    margin-bottom: 4px;
  }
  .tagline { opacity: 0.7; margin-bottom: 18px; font-size: 0.95rem; }
  .hud {
    display: flex;
    gap: 28px;
    margin-bottom: 18px;
    font-size: 1.15rem;
    font-weight: 600;
  }
  .hud span { color: var(--accent); }
  #board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: clamp(10px, 2.5vw, 22px);
    width: min(92vw, 520px);
    cursor: none;
  }
  .hole {
    position: relative;
    aspect-ratio: 1;
    background: var(--hole);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: inset 0 8px 18px rgba(0,0,0,0.7), 0 2px 0 rgba(255,255,255,0.05);
  }
  .noob {
    position: absolute;
    left: 50%;
    bottom: -100%;
    transform: translateX(-50%);
    width: 72%;
    transition: bottom 0.12s cubic-bezier(.34,1.56,.64,1);
    pointer-events: none;
  }
  .hole.up .noob { bottom: 6%; }
  .hole.bonked .noob { filter: brightness(2) saturate(0); transition: none; }
  #hammer {
    position: fixed;
    width: 72px;
    height: 72px;
    pointer-events: none;
    z-index: 10;
    transform: translate(-22px, -54px) rotate(-20deg);
    transition: transform 0.06s ease;
    display: none;
  }
  #hammer.smash { transform: translate(-22px, -54px) rotate(35deg); }
  .pop {
    position: fixed;
    pointer-events: none;
    font-weight: 800;
    font-size: 1.3rem;
    color: var(--accent);
    z-index: 11;
    animation: rise 0.7s ease-out forwards;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
  }
  @keyframes rise {
    from { opacity: 1; transform: translateY(0) scale(1); }
    to   { opacity: 0; transform: translateY(-48px) scale(1.4); }
  }
  button {
    margin-top: 20px;
    font-size: 1.1rem;
    font-weight: 700;
    padding: 12px 34px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: #221038;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(255, 92, 138, 0.35);
    transition: transform 0.1s;
  }
  button:hover { transform: scale(1.06); }
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(18, 10, 36, 0.86);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    z-index: 20;
    text-align: center;
    padding: 20px;
  }
  #overlay.hidden { display: none; }
  #overlay h2 { font-size: 2rem; color: var(--accent); }
  #rank { font-size: 1.2rem; }
</style>
</head>
<body>
  <h1>HAMMUMU</h1>
  <div class="tagline">bonk the noobs. spare the pros. 30 seconds.</div>
  <div class="hud">
    SCORE <span id="score">0</span>
    TIME <span id="time">30</span>
    BEST <span id="best">0</span>
  </div>
  <div id="board"></div>

  <svg id="hammer" viewBox="0 0 100 100">
    <rect x="44" y="30" width="12" height="62" rx="5" fill="#a9743c"/>
    <rect x="18" y="8" width="64" height="30" rx="9" fill="#9aa3b2"/>
    <rect x="18" y="8" width="64" height="12" rx="6" fill="#c7ced9"/>
  </svg>

  <div id="overlay">
    <h2 id="ovTitle">HAMMUMU</h2>
    <p id="ovText">Noobs 😵 pop out of holes — smash them!<br>
      Pros 😎 pop out too — do NOT smash the pros.<br>
      Noob = +10 &nbsp;·&nbsp; Pro = −15 &nbsp;·&nbsp; Combo bonus for streaks.</p>
    <div id="rank"></div>
    <button id="startBtn">START</button>
  </div>

<script>
(() => {
  const NOOB = (face) => `
    <svg class="noob" viewBox="0 0 100 100">
      <ellipse cx="50" cy="96" rx="34" ry="8" fill="rgba(0,0,0,0.4)"/>
      <rect x="22" y="34" width="56" height="58" rx="24" fill="${face === 'pro' ? '#59d98c' : '#ffb937'}"/>
      <circle cx="38" cy="58" r="5.5" fill="#221038"/>
      <circle cx="62" cy="58" r="5.5" fill="#221038"/>
      ${face === 'pro'
        ? '<rect x="28" y="50" width="44" height="12" rx="6" fill="#221038"/><rect x="46" y="52" width="8" height="8" fill="#59d98c"/><path d="M38 76 Q50 82 62 76" stroke="#221038" stroke-width="4" fill="none" stroke-linecap="round"/>'
        : '<circle cx="50" cy="74" r="7" fill="#221038"/><path d="M26 34 Q50 14 74 34" stroke="#ff5c8a" stroke-width="8" fill="none" stroke-linecap="round"/>'}
    </svg>`;

  const board = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovText = document.getElementById('ovText');
  const rankEl = document.getElementById('rank');
  const startBtn = document.getElementById('startBtn');
  const hammer = document.getElementById('hammer');

  const holes = [];
  for (let i = 0; i < 9; i++) {
    const h = document.createElement('div');
    h.className = 'hole';
    h.dataset.i = i;
    board.appendChild(h);
    holes.push({ el: h, kind: null, timer: null });
  }

  let score = 0, timeLeft = 30, combo = 0, playing = false;
  let tickTimer = null, spawnTimer = null;
  let best = 0;
  try { best = +localStorage.getItem('hammumu-best') || 0; } catch (e) {}
  bestEl.textContent = best;

  // tiny beeps, no assets
  let ac;
  function beep(freq, dur, type = 'square', vol = 0.06) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
      o.connect(g); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime + dur);
    } catch (e) {}
  }

  function popText(x, y, text, color) {
    const d = document.createElement('div');
    d.className = 'pop';
    d.textContent = text;
    d.style.left = x + 'px';
    d.style.top = y + 'px';
    if (color) d.style.color = color;
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 700);
  }

  function spawn() {
    if (!playing) return;
    const free = holes.filter(h => !h.kind);
    if (free.length) {
      const h = free[Math.floor(Math.random() * free.length)];
      const kind = Math.random() < 0.72 ? 'noob' : 'pro';
      h.kind = kind;
      h.el.innerHTML = NOOB(kind);
      h.el.classList.add('up');
      h.el.classList.remove('bonked');
      const stay = Math.max(420, 1000 - (30 - timeLeft) * 18) + Math.random() * 400;
      h.timer = setTimeout(() => hide(h), stay);
    }
    const gap = Math.max(260, 620 - (30 - timeLeft) * 11);
    spawnTimer = setTimeout(spawn, gap + Math.random() * 220);
  }

  function hide(h) {
    clearTimeout(h.timer);
    h.kind = null;
    h.el.classList.remove('up');
  }

  function bonk(e) {
    if (!playing) return;
    hammer.classList.add('smash');
    setTimeout(() => hammer.classList.remove('smash'), 80);
    const holeEl = e.target.closest('.hole');
    if (!holeEl) return;
    const h = holes[+holeEl.dataset.i];
    if (!h.kind) { combo = 0; return; }
    const x = e.clientX, y = e.clientY;
    if (h.kind === 'noob') {
      combo++;
      const bonus = Math.min(combo - 1, 5) * 2;
      const pts = 10 + bonus;
      score += pts;
      popText(x, y, '+' + pts + (combo >= 3 ? ' 🔥' : ''), '#ffb937');
      beep(300 + combo * 40, 0.08);
    } else {
      combo = 0;
      score = Math.max(0, score - 15);
      popText(x, y, '−15 that was a PRO 😎', '#ff5c8a');
      beep(110, 0.25, 'sawtooth', 0.09);
    }
    scoreEl.textContent = score;
    holeEl.classList.add('bonked');
    setTimeout(() => hide(h), 70);
  }

  function rank(s) {
    if (s >= 300) return 'HAMMUMU GOD 🔱';
    if (s >= 220) return 'Certified Bonker 🔨';
    if (s >= 150) return 'Semi-Pro Smasher 💪';
    if (s >= 80) return 'Apprentice of the Hammer 🪵';
    return 'Official Noob (it’s in the repo name) 🐣';
  }

  function end() {
    playing = false;
    clearTimeout(spawnTimer);
    clearInterval(tickTimer);
    holes.forEach(hide);
    hammer.style.display = 'none';
    document.body.style.cursor = '';
    if (score > best) {
      best = score;
      try { localStorage.setItem('hammumu-best', best); } catch (e) {}
      bestEl.textContent = best;
    }
    ovTitle.textContent = 'TIME! ' + score + ' pts';
    ovText.innerHTML = score >= best && score > 0 ? 'NEW BEST! 🎉' : 'Best: ' + best;
    rankEl.textContent = 'Rank: ' + rank(score);
    startBtn.textContent = 'AGAIN';
    overlay.classList.remove('hidden');
    beep(520, 0.12); setTimeout(() => beep(390, 0.2), 130);
  }

  function start() {
    score = 0; timeLeft = 30; combo = 0; playing = true;
    scoreEl.textContent = 0; timeEl.textContent = 30;
    overlay.classList.add('hidden');
    hammer.style.display = 'block';
    holes.forEach(hide);
    beep(440, 0.08); setTimeout(() => beep(660, 0.1), 100);
    tickTimer = setInterval(() => {
      timeLeft--;
      timeEl.textContent = timeLeft;
      if (timeLeft <= 5 && timeLeft > 0) beep(880, 0.05, 'sine', 0.04);
      if (timeLeft <= 0) end();
    }, 1000);
    spawn();
  }

  document.addEventListener('mousemove', e => {
    hammer.style.left = e.clientX + 'px';
    hammer.style.top = e.clientY + 'px';
  });
  document.addEventListener('mousedown', bonk);
  startBtn.addEventListener('click', start);
})();
</script>
</body>
</html>
